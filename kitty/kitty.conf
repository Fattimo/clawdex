startup_session claude.session


macos_option_as_alt yes
macos_quit_when_last_window_closed yes
confirm_os_window_close 1

font_size 13.0
tab_bar_edge left
tab_title_max_length 18
tab_bar_style custom
tab_title_template "   {index}  {title}   "
tab_bar_margin_height 4.0 4.0
scrollback_lines 20000
enable_audio_bell no

# clawdex: let the switchboard focus a session's tab on click. Socket lives in
# the per-user temp dir (kitty appends -<pid>); TTY remote control stays off
# entirely (the daemon paints tab colors over the socket).
allow_remote_control socket-only
listen_on unix:${TMPDIR}/kitty

# Disable other kitty keyboard bindings; keep clipboard shortcuts.
clear_all_shortcuts yes
map cmd+c copy_or_noop
map ctrl+shift+c copy_to_clipboard
map cmd+v kitten smart_paste.py
map ctrl+shift+v paste_from_clipboard

# Cmd+click opens links, even while a full-screen app has the mouse.
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
mouse_map cmd+left press grabbed discard_event


# Sidebar selection uses weight rather than italic text.
active_tab_font_style bold
inactive_tab_font_style normal

# Neutral sidebar canvas; per-session accents are drawn as status dots.
tab_bar_background #101318
tab_bar_margin_color #101318
inactive_tab_background #101318
inactive_tab_foreground #c6cdd8
active_tab_background #222936
active_tab_foreground #f1f5fa

# Centered cards, packed without blank gaps.
tab_title_max_lines 3

# BEGIN effects playground — mouse halo only
custom_shaders clawdex-halo
cursor_trail 0
# END effects playground
