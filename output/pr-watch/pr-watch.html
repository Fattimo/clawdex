<style>
#pr-watch { --pw-bg:light-dark(#ebebe8,#23272d); --pw-paper:light-dark(#ffffff,#30343a); --pw-ink:light-dark(#282d31,#eef0f1); --pw-soft:light-dark(#6c7378,#a8afb5); --pw-line:light-dark(#e7e8e8,#45494e); --pw-green:light-dark(#3a8058,#86c9a0); --pw-orange:light-dark(#a25931,#edb081); --pw-blue:light-dark(#527c9d,#9fbfda); --pw-pill:light-dark(#30353b,#30353b); --pw-pilltext:light-dark(#f4f4f3,#f4f4f3); --pw-shadow:light-dark(#1c252b15,#06080b35); color:var(--pw-ink); font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color-scheme:light dark; width:100%; }
#pr-watch * { box-sizing:border-box; }
#pr-watch button { font:inherit; }
#pr-watch button:focus-visible { outline:3px solid var(--pw-blue); outline-offset:4px; }
#pr-watch [hidden] { display:none!important; }
#pr-watch .pw-stage { position:relative; display:flex; flex-direction:column; min-height:620px; padding:24px; background:var(--pw-bg); border-radius:14px; }
#pr-watch .pw-caption { display:flex; justify-content:space-between; align-items:center; gap:12px; color:var(--pw-soft); font-size:12px; }
#pr-watch .pw-caption strong { color:var(--pw-ink); font-size:14px; font-weight:500; }
#pr-watch .pw-companion { position:relative; display:flex; flex-direction:column; align-items:flex-end; margin:auto 12px 0 auto; width:332px; max-width:100%; }
#pr-watch .pw-popover { position:absolute; right:0; bottom:calc(100% + 8px); width:100%; background:var(--pw-paper); border:1px solid var(--pw-line); border-radius:15px; padding:16px; box-shadow:0 10px 32px var(--pw-shadow); }
#pr-watch .pw-pop-head { display:flex; align-items:flex-start; justify-content:space-between; gap:15px; }
#pr-watch .pw-title { font-size:14px; font-weight:500; margin:0; }
#pr-watch .pw-repo { font-size:11px; color:var(--pw-soft); margin-top:3px; }
#pr-watch .pw-close { display:grid; place-items:center; border:0; background:transparent; color:var(--pw-soft); border-radius:6px; width:25px; height:25px; padding:5px; }
#pr-watch .pw-close i { width:14px; height:14px; }
#pr-watch .pw-health { display:flex; align-items:center; gap:7px; font-size:12px; padding:13px 0; }
#pr-watch .pw-health i { width:15px; height:15px; }
#pr-watch .pw-prs { display:grid; }
#pr-watch .pw-pr { display:flex; align-items:center; gap:9px; padding:10px 0; border-top:1px solid var(--pw-line); }
#pr-watch .pw-pr-symbol { font-size:13px; color:var(--pw-green); width:13px; text-align:center; flex:none; }
#pr-watch .pw-pr-name { font-size:12px; }
#pr-watch .pw-pr-id { color:var(--pw-soft); font-size:11px; }
#pr-watch .pw-pr-status { margin-left:auto; color:var(--pw-soft); font-size:11px; white-space:nowrap; }
#pr-watch .pw-next { border-top:1px solid var(--pw-line); padding-top:12px; margin-top:1px; color:var(--pw-soft); font-size:12px; }
#pr-watch .pw-next strong { color:var(--pw-ink); font-weight:500; }
#pr-watch .pw-demo-action { margin-top:12px; background:var(--pw-pill); color:var(--pw-pilltext); border:0; border-radius:8px; padding:8px 11px; width:100%; font-size:12px; }
#pr-watch .pw-demo-action:disabled { opacity:.55; }
#pr-watch .pw-dock { display:flex; align-items:flex-end; gap:15px; padding-top:17px; padding-right:3px; }
#pr-watch .pw-stacks { display:grid; gap:6px; padding-bottom:6px; }
#pr-watch .pw-pill { display:flex; align-items:center; gap:8px; background:var(--pw-pill); color:var(--pw-pilltext); border:1px solid transparent; border-radius:20px; padding:7px 12px; box-shadow:0 2px 5px var(--pw-shadow); min-width:176px; text-align:left; }
#pr-watch .pw-pill[aria-pressed=true] { border-color:color-mix(in srgb,var(--pw-pilltext) 55%,transparent); }
#pr-watch .pw-light { width:7px; height:7px; border-radius:50%; background:#8eca9e; flex:none; }
#pr-watch .pw-pill[data-status=running] .pw-light { background:#9fb9d2; }
#pr-watch .pw-pill[data-status=failed] .pw-light { background:#efaf84; }
#pr-watch .pw-pill[data-status=merged] .pw-light { background:#a6a9ac; }
#pr-watch .pw-pill-name { font-size:12px; }
#pr-watch .pw-pill-status { margin-left:auto; font-size:11px; color:#d0d4d8; }
#pr-watch .pw-dog-button { display:block; border:0; background:transparent; padding:0; margin:0; border-radius:15px; }
#pr-watch .pw-dog { display:block; width:var(--pw-dog-size,105px); height:auto; filter:drop-shadow(0 4px 2px var(--pw-shadow)); }
#pr-watch .pw-note { display:flex; justify-content:space-between; gap:12px; font-size:11px; color:var(--pw-soft); margin-top:28px; }
@media(max-width:460px) { #pr-watch .pw-stage { padding:18px 13px; } #pr-watch .pw-companion { margin:auto 0 0 auto; } #pr-watch .pw-caption { font-size:11px; } #pr-watch .pw-dock { gap:9px; padding-right:0; } #pr-watch .pw-pill { min-width:160px; padding:7px 10px; } #pr-watch .pw-dog { max-width:95px; } #pr-watch .pw-note { flex-direction:column; gap:3px; } }
</style>

    <div class="pw-companion">
      <section class="pw-popover" id="pw-popover" aria-label="Selected PR stack">
        <div class="pw-pop-head"><div><h2 class="pw-title" id="pw-title">Billing rollout</h2><div class="pw-repo" id="pw-repo">app · 3 PRs, base → tip</div></div><button class="pw-close cursor-interaction" type="button" id="pw-close" aria-label="Close stack details"><i data-lucide="x" aria-hidden="true"></i></button></div>
        <div class="pw-health" id="pw-health" aria-live="polite">✓ Entire stack ready</div>
        <div class="pw-prs" id="pw-prs"></div>
        <div class="pw-next" id="pw-next"></div>
        <button type="button" class="pw-demo-action cursor-interaction" id="pw-action">Merge next PR · demo</button>
      </section>
      <div class="pw-dock">
        <div class="pw-stacks" aria-label="Your PR stacks">
          <button type="button" class="pw-pill cursor-interaction" data-stack="billing" data-status="ready" aria-pressed="true"><span class="pw-light"></span><span class="pw-pill-name">billing</span><span class="pw-pill-status" id="pw-billing-status">3/3 ready</span></button>
          <button type="button" class="pw-pill cursor-interaction" data-stack="search" data-status="running" aria-pressed="false"><span class="pw-light"></span><span class="pw-pill-name">search</span><span class="pw-pill-status" id="pw-search-status">checks 2/3</span></button>
          <button type="button" class="pw-pill cursor-interaction" data-stack="auth" data-status="failed" aria-pressed="false"><span class="pw-light"></span><span class="pw-pill-name">auth</span><span class="pw-pill-status" id="pw-auth-status">1 failed</span></button>
        </div>
        <button class="pw-dog-button cursor-interaction" id="pw-dog-button" type="button" aria-label="Show or hide selected stack details"><img class="pw-dog" id="pw-dog" alt="Your cream clawdex dog" width="192" height="208"></button>
      </div>
    </div>
    <div class="pw-note"><span>Click a stack. The dog keeps you company.</span><span>Sample data · no GitHub actions</span></div>
  </div>
</div>

<script>
(() => {
  const root=document.getElementById('pr-watch');
  const q=id=>root.querySelector('#'+id);
  const sprites=JSON.parse(document.getElementById('pw-sprite-data').textContent);
  const stacks={
    billing:{name:'Billing rollout',repo:'app',status:'ready',prs:[{id:8121,name:'Schema',state:'ready'},{id:8122,name:'Backfill',state:'ready'},{id:8123,name:'Enable rollout',state:'ready'}]},
    search:{name:'Search refresh',repo:'app',status:'running',prs:[{id:8104,name:'Index',state:'ready'},{id:8105,name:'Ranking',state:'ready'},{id:8106,name:'Search UI',state:'running'}]},
    auth:{name:'Session cleanup',repo:'app',status:'failed',prs:[{id:8091,name:'Token cleanup',state:'ready'},{id:8092,name:'Session expiry',state:'failed'}]}
  };
  const state={stack:'billing',open:true,searchDone:false,authDone:false,merged:[]};
  const design={dogSize:105};
  const symbols={ready:'✓',merged:'✓',running:'◦',failed:'!'};
  const statuses={ready:'CI + review ✓',merged:'Merged',running:'CI running',failed:'CI failed'};
  function apply(saved) {
    const data=saved?.privateContent;if(!data||data.concept!=='pr-watch')return;
    if(Object.hasOwn(stacks,data.stack))state.stack=data.stack;
    state.open=data.open!==false;state.searchDone=data.searchDone===true;state.authDone=data.authDone===true;
    state.merged=Array.isArray(data.merged)?data.merged.filter(id=>Object.values(stacks).some(s=>s.prs.some(p=>p.id===id))):[];
  }
  function save(){window.openai?.setWidgetState?.({modelContent:{concept:'PR watch: same clawdex dog with simple stack pills',selectedStack:stacks[state.stack].name},privateContent:{...state,concept:'pr-watch'}}).catch(()=>{});}
  function render(){
    root.style.setProperty('--pw-dog-size',design.dogSize+'px');
    q('pw-popover').hidden=!state.open;
    for(const [key,s] of Object.entries(stacks)){
      s.prs.forEach((p,index)=>{p.state=state.merged.includes(p.id)?'merged':key==='search'&&index===2&&!state.searchDone?'running':key==='auth'&&index===1&&!state.authDone?'failed':'ready';});
      s.status=s.prs.some(p=>p.state==='failed')?'failed':s.prs.some(p=>p.state==='running')?'running':s.prs.every(p=>p.state==='merged')?'merged':'ready';
      const pill=root.querySelector('[data-stack="'+key+'"]');
      pill.dataset.status=s.status;pill.setAttribute('aria-pressed',String(key===state.stack&&state.open));
      const remaining=s.prs.filter(p=>p.state!=='merged').length;
      const text=s.status==='ready'?`${remaining}/${remaining} ready`:s.status==='running'?'checks 2/3':s.status==='failed'?'1 failed':'merged';
      q('pw-'+key+'-status').textContent=text;pill.setAttribute('aria-label',`${s.name}, ${text}. Show stack details.`);
    }
    const s=stacks[state.stack];
    q('pw-title').textContent=s.name;q('pw-repo').textContent=`${s.repo} · ${s.prs.length} PRs, base → tip`;
    q('pw-health').textContent=s.status==='ready'?'✓ Entire stack ready':s.status==='merged'?'✓ Stack merged':s.status==='running'?'◦ Waiting for the last check':'! One PR needs you';
    q('pw-health').style.color=s.status==='failed'?'var(--pw-orange)':s.status==='running'?'var(--pw-blue)':'var(--pw-green)';
    q('pw-dog').src=sprites[s.status==='failed'?'attention':s.status==='ready'||s.status==='merged'?'ready':'idle'];
    q('pw-prs').replaceChildren();
    for(const p of s.prs){
      const row=document.createElement('div');row.className='pw-pr';
      const icon=document.createElement('span');icon.className='pw-pr-symbol';icon.textContent=symbols[p.state];
      if(p.state==='failed')icon.style.color='var(--pw-orange)';if(p.state==='running')icon.style.color='var(--pw-blue)';
      const content=document.createElement('div');
      const name=document.createElement('div');name.className='pw-pr-name';name.textContent=p.name;
      const id=document.createElement('div');id.className='pw-pr-id';id.textContent='#'+p.id;content.append(name,id);
      const status=document.createElement('span');status.className='pw-pr-status';status.textContent=statuses[p.state];
      row.append(icon,content,status);q('pw-prs').append(row);
    }
    const next=s.prs.find(p=>p.state!=='merged');
    q('pw-next').textContent=s.status==='ready'?`Next: merge #${next.id} first.`:s.status==='merged'?'All merged. Back to your work.':s.status==='running'?'Nothing to do yet. We’ll watch the checks.':'#8092 · session-expiry test failed.';
    q('pw-action').textContent=s.status==='ready'?'Merge next PR · demo':s.status==='running'?'Finish last check · demo':s.status==='failed'?'Fix and rerun check · demo':'All done';
    q('pw-action').disabled=s.status==='merged';
  }
  root.querySelectorAll('[data-stack]').forEach(button=>button.addEventListener('click',()=>{state.stack=button.dataset.stack;state.open=true;render();save();}));
  q('pw-close').addEventListener('click',()=>{state.open=false;render();save();});
  q('pw-dog-button').addEventListener('click',()=>{state.open=!state.open;render();save();});
  q('pw-action').addEventListener('click',()=>{
    const s=stacks[state.stack];
    if(s.status==='running')state.searchDone=true;
    else if(s.status==='failed')state.authDone=true;
    else if(s.status==='ready'){const next=s.prs.find(p=>p.state!=='merged');if(next)state.merged.push(next.id);}
    render();save();
  });
  root.addEventListener('keydown',event=>{if(event.key==='Escape'){state.open=false;render();save();}});
  apply(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){apply(event.detail.globals.widgetState);render();}});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(design,'dogSize',{label:'Dog size',min:75,max:125,unit:'px'});}
})();
</script>
